<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlatHunter | Oferty</title>
    <style>
        :root { color-scheme: light; --ink: #202522; --muted: #66706a; --paper: #eef1ed; --card: #ffffff; --line: #dce3dc; --accent: #285943; --soft: #e8f0e9; --price: #ad542d; --button: #285943; --button-hover: #1d4735; --shadow: 0 12px 30px rgba(30, 53, 40, .08); }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: radial-gradient(circle at top right, #f7faf6 0, transparent 34rem), var(--paper); font: 16px/1.5 "Segoe UI", sans-serif; overflow-x: hidden; }
        header { max-width: 1180px; margin: 0 auto; padding: 48px 24px 28px; display: flex; justify-content: space-between; align-items: end; gap: 32px; }
        h1 { min-width: 0; margin: 0; color: var(--accent); font-size: 3.3rem; line-height: .96; font-weight: 700; letter-spacing: -0.05em; overflow-wrap: anywhere; }
        h1 a { color: inherit; text-decoration: none; }
        header p { max-width: 360px; margin: 0; color: var(--muted); font-size: 1rem; }
        main { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 0 24px; border-bottom: 1px solid var(--line); }
        select, button { min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: rgba(255,255,255,.82); color: var(--ink); font: inherit; cursor: pointer; transition: border-color .2s ease, background .2s ease, transform .2s ease; }
        select:hover, button:hover { border-color: var(--accent); }
        button:active { transform: translateY(1px); }
        button { border-color: var(--button); background: linear-gradient(180deg, var(--button) 0%, var(--button-hover) 100%); color: white; }
        #status { margin: 22px 0 14px; color: var(--muted); }
        .review-tab { min-height: 42px; margin-left: auto; border-color: var(--line); background: transparent; color: var(--muted); font-size: .82rem; }
        .review-tab + .review-tab { margin-left: 0; }
        .review-tab.active { border-color: var(--ink); color: var(--ink); background: var(--soft); }
        .grid { display: flex; flex-direction: column; gap: 18px; padding-top: 20px; border-top: 1px solid var(--line); }
        article { display: grid; grid-template-columns: 190px 220px minmax(0, 1fr) 170px; gap: 26px; align-items: start; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.94); box-shadow: var(--shadow); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
        article:hover { transform: translateY(-2px); border-color: #b9cdbd; box-shadow: 0 16px 34px rgba(30, 53, 40, .12); }
        article:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
        .listing-image, .listing-summary, .listing-facts, .listing-links { min-width: 0; }
        .listing-image { width: 190px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 10px; background: var(--soft); }
        .listing-image img { display: block; width: 100%; height: 100%; object-fit: cover; }
        .listing-image.no-image { display: grid; place-items: center; color: var(--muted); font: .72rem/1.2 sans-serif; text-align: center; }
        .listing-summary { padding-left: 0; }
        article h2 { margin: 0 0 14px; font-size: 1.14rem; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }
        .price { margin-bottom: 14px; color: var(--price); font-size: 1.38rem; font-weight: 800; }
        .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px 18px; margin: 0; color: var(--muted); font-family: sans-serif; font-size: .76rem; }
        .facts > div { min-width: 0; }
        .facts strong { display: block; margin-top: 2px; color: var(--ink); font-size: .88rem; line-height: 1.25; overflow-wrap: anywhere; }
        .description { grid-column: 1 / -1; margin: 4px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; line-height: 1.6; }
        article a { color: var(--ink); font-family: sans-serif; font-weight: 700; text-decoration: none; }
        .sources { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; font: 700 .75rem/1.2 sans-serif; text-transform: uppercase; }
        .source { padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px; }
        .portal { margin-top: 0; padding-top: 0; }
        .portal + .portal { margin-top: 12px; }
        .portal-title { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 5px; font: 700 .8rem/1.2 sans-serif; text-transform: uppercase; }
        .portal-name { display: inline-flex; align-items: center; gap: 6px; }
        .portal-badge { padding: 3px 5px; border-radius: 3px; background: var(--soft); color: var(--ink); font-size: .68rem; }
        .portal-link { display: inline-flex; align-items: center; width: fit-content; padding: 8px 10px; border-radius: 8px; background: var(--soft); color: var(--accent); font-size: .8rem; }
        .portal-price { color: var(--price); font-weight: 700; }
        .portal.visited { opacity: .72; }
        .visited-label { margin-left: 6px; color: var(--muted); font-size: .68rem; text-transform: none; }
        .manual-actions { margin-top: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .manual-actions select { min-height: 30px; width: auto; max-width: 100%; padding: 0 8px; color: var(--muted); font: .7rem/1 sans-serif; border-radius: 999px; }
        .hidden-action { margin-left: 0; min-height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: .7rem/1 sans-serif; }
        .confirm-modal[hidden] { display: none; }
        .confirm-modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: rgba(24, 33, 38, .32); }
        .confirm-dialog { width: min(100%, 390px); padding: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 0 18px 60px rgba(24, 33, 38, .2); }
        .confirm-dialog h2 { margin: 0 0 8px; font-size: 1.2rem; }
        .confirm-dialog p { margin: 0; color: var(--muted); font-family: sans-serif; font-size: .9rem; }
        .confirm-actions { display: flex; gap: 10px; margin-top: 22px; }
        .confirm-actions button { flex: 1; min-height: 44px; }
        .confirm-actions .cancel { border-color: var(--line); background: transparent; color: var(--ink); }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 24px 0 8px; color: var(--muted); font-family: sans-serif; font-size: .9rem; }
        .pagination button { min-height: 36px; padding: 0 12px; border-radius: 10px; }
        .pagination button:disabled { cursor: default; opacity: .45; }
        .empty { padding: 35px 0; color: var(--muted); }
        @media (max-width: 1050px) and (min-width: 701px) {
            article { grid-template-columns: 160px minmax(220px, 1fr) minmax(0, 1.4fr); gap: 20px; }
            .listing-image { width: 160px; }
            .listing-links { grid-column: 2 / -1; }
        }
        @media (max-width: 700px) {
            header { display: block; padding-top: 28px; }
            h1 { font-size: 2.6rem; }
            header p { margin-top: 18px; }
            article { display: block; }
            .listing-image { width: min(100%, 260px); margin-bottom: 16px; }
            article > * + * { margin-top: 16px; }
            .facts { grid-template-columns: repeat(3, minmax(80px, 1fr)); }
            .portal { padding-top: 12px; border-top: 1px solid var(--line); }
            .review-tab { margin-left: 0; }
        }
        @media (max-width: 420px) {
            header { padding-inline: 16px; }
            h1 { font-size: 2.15rem; }
            main { padding-inline: 16px; }
            .facts { grid-template-columns: repeat(2, minmax(90px, 1fr)); }
        }
        @media (max-width: 600px) {
            header { padding: 26px 16px 18px; }
            h1 { font-size: 2.35rem; }
            header p { max-width: none; font-size: .95rem; }
            main { padding: 0 16px 40px; }
            .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 12px 0 18px; }
            .toolbar select, .toolbar button { width: 100%; min-width: 0; padding-inline: 10px; font-size: .86rem; }
            .toolbar #refresh { grid-column: 1; }
            .toolbar #wp-tab { grid-column: 2; margin-left: 0; }
            .toolbar #rama-tab { grid-column: 1 / -1; margin-left: 0; }
            #status { margin: 16px 0 12px; font-size: .9rem; }
            article { padding: 18px; }
            .listing-image { top: 18px; left: 18px; }
            article h2 { font-size: 1.05rem; line-height: 1.3; }
            .price { font-size: 1.2rem; }
            .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
            .facts strong { font-size: .86rem; }
            .portal-title { align-items: flex-start; flex-wrap: wrap; }
            .portal-name { min-width: 0; flex-wrap: wrap; }
            .portal-price { margin-left: auto; }
            .pagination { flex-wrap: wrap; gap: 10px; }
        }
        @media (max-width: 420px) {
            h1 { font-size: 2.15rem; }
            .toolbar select, .toolbar button { font-size: .8rem; padding-inline: 8px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="page-title"><a href="/">FlatHunter<br><em>oferty</em></a></h1>
        <p>Twoja lokalna lista mieszkań. Najnowsze rekordy z bazy, opisy i wykryte cechy w jednym miejscu.</p>
    </header>
    <main>
        <div class="toolbar">
            <select id="district"><option value="">Wszystkie dzielnice</option></select>
            <select id="source"><option value="">Wszystkie źródła</option></select>
            <button id="refresh">Odśwież oferty</button>
            <button id="wp-tab" class="review-tab" type="button">WP do analizy</button>
            <button id="rama-tab" class="review-tab" type="button">Rama H do analizy</button>
            <button id="uncertain-tab" class="review-tab" type="button">Niepewne</button>
            <button id="hidden-tab" class="review-tab" type="button">Ukryte</button>
        </div>
        <div id="status">Ładowanie...</div>
        <section id="listings" class="grid"></section>
        <nav id="pagination" class="pagination" aria-label="Paginacja ofert"></nav>
    </main>
    <div id="confirm-modal" class="confirm-modal" hidden>
        <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h2 id="confirm-title">Potwierdź oznaczenie</h2>
            <p id="confirm-message"></p>
            <div class="confirm-actions">
                <button id="confirm-cancel" class="cancel" type="button">Anuluj</button>
                <button id="confirm-submit" type="button">Potwierdź</button>
            </div>
        </div>
    </div>
    <script>
        const listingsElement = document.querySelector('#listings');
        const statusElement = document.querySelector('#status');
        const districtElement = document.querySelector('#district');
        const sourceElement = document.querySelector('#source');
        const paginationElement = document.querySelector('#pagination');
        const confirmModal = document.querySelector('#confirm-modal');
        const confirmMessage = document.querySelector('#confirm-message');
        const confirmCancel = document.querySelector('#confirm-cancel');
        const confirmSubmit = document.querySelector('#confirm-submit');
        const pageSize = 20;
        let currentPage = 1;
        let reviewBuildingType = null;
        let showHidden = false;
        let showUncertain = false;

        async function loadListings() {
            statusElement.textContent = 'Ładowanie ofert...';
            const params = new URLSearchParams({ page: String(currentPage), pageSize: String(pageSize) });
            if (reviewBuildingType) params.set('reviewBuildingType', reviewBuildingType);
            if (showHidden) params.set('showHidden', 'true');
            if (showUncertain) params.set('uncertain', 'true');
            if (districtElement.value) params.set('district', districtElement.value);
            if (sourceElement.value) params.set('portal', sourceElement.value);
            const response = await fetch(`/api/properties?${params}`);
            const data = await response.json();
            renderProperties(data.properties);
            statusElement.firstChild.textContent = `${data.total} nieruchomości, strona ${data.page} z ${Math.max(1, Math.ceil(data.total / data.pageSize))} `;
            renderPagination(data);
        }

        function renderProperties(properties) {
            listingsElement.innerHTML = properties.length ? properties.map(property => {
                const main = property.listings[0];
                return `
                <article data-primary-url="${escapeAttribute(main.url)}" tabindex="0" role="link" aria-label="Otwórz ogłoszenie ${escapeAttribute(main.title)}">
                    ${main.imageUrl ? `<div class="listing-image"><img src="${escapeAttribute(main.imageUrl)}" alt="" loading="lazy"></div>` : '<div class="listing-image no-image">Brak zdjęcia</div>'}
                    <div class="listing-summary">
                        <h2>${formatTitle(main.title)}</h2>
                        <div class="manual-actions">
                            <select data-manual-id="${main.id}" data-current-type="${escapeAttribute(main.buildingType || '')}" aria-label="Oznacz jako">
                                <option value="" ${!['wielka plyta', 'rama h', 'kamienica'].includes(main.buildingType) ? 'selected' : ''}>Oznacz jako</option>
                                <option value="wielka plyta" ${main.buildingType === 'wielka plyta' ? 'selected' : ''}>WP</option>
                                <option value="rama h" ${main.buildingType === 'rama h' ? 'selected' : ''}>Rama H</option>
                                <option value="kamienica" ${main.buildingType === 'kamienica' ? 'selected' : ''}>Kamienica</option>
                            </select>
                            <button type="button" class="hidden-action" data-hidden-id="${main.id}">${main.hidden ? 'Przywróć' : 'Ukryj'}</button>
                        </div>
                        <div class="price">od ${formatNumber(property.lowestPrice)} zł</div>
                    </div>
                    <div class="listing-facts">
                        <div class="facts">
                        <div>Dzielnica<strong>${escapeHtml(main.district || 'Nieznana')}</strong></div>
                        <div>Metraż<strong>${main.area ?? '-'} m²</strong></div>
                        <div>Pokoje<strong>${main.rooms ?? '-'}</strong></div>
                        <div>Piętro<strong>${main.floor ?? '-'}/${main.totalFloors ?? '-'}</strong></div>
                        <div>Własność<strong>${escapeHtml(main.ownershipType || '-')}</strong></div>
                        <div>Rodzaj zabudowy<strong>${escapeHtml(formatBuildingType(main.buildingType))}</strong></div>
                        <div>Winda<strong>${formatBoolean(main.hasElevator)}</strong></div>
                        <div>Garaż<strong>${formatBoolean(main.hasGarage)}</strong></div>
                        <div>Miejsce postojowe<strong>${formatBoolean(main.hasParkingSpace)}</strong></div>
                        <div>Komórka<strong>${formatBoolean(main.hasStorageUnit)}</strong></div>
                        <div>Piwnica<strong>${formatBoolean(main.hasBasement)}</strong></div>
                        <div>Balkon<strong>${formatBoolean(main.hasBalcony)}</strong></div>
                        <div>Ogród<strong>${formatBoolean(main.hasGarden)}</strong></div>
                        <div>Rok budowy<strong>${main.buildYear ?? '-'}</strong></div>
                        <div>Czynsz<strong>${formatNumber(main.rent)} zł</strong></div>
                        <div>Dodano<strong>${escapeHtml(getAddedDate(main))}</strong></div>
                        </div>
                    </div>
                    <div class="listing-links">
                    ${property.listings.map(listing => `
                        <div class="portal${isVisited(listing.url) ? ' visited' : ''}">
                            <div class="portal-title"><span class="portal-price">${formatNumber(listing.price)} zł</span>${isVisited(listing.url) ? '<span class="visited-label">Odwiedzone</span>' : ''}</div>
                            <a class="portal-link" data-listing-url="${escapeAttribute(listing.url)}" href="${escapeAttribute(listing.url)}" target="_blank" rel="noreferrer">${getPortalActionLabel(listing)} →</a>
                        </div>
                    `).join('')}
                    </div>
                    <p class="description">${escapeHtml((main.description || 'Brak opisu').slice(0, 260))}</p>
                </article>
            `;
            }).join('') : '<p class="empty">Brak ofert spełniających filtry.</p>';
        }

        function renderPagination(data) {
            const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
            paginationElement.innerHTML = totalPages > 1 ? `
                <button type="button" data-page="${data.page - 1}" ${data.page === 1 ? 'disabled' : ''}>← Poprzednia</button>
                <span>Strona ${data.page} / ${totalPages}</span>
                <button type="button" data-page="${data.page + 1}" ${data.page === totalPages ? 'disabled' : ''}>Następna →</button>
            ` : '';
        }

        function formatNumber(value) { return value === null ? '-' : new Intl.NumberFormat('pl-PL').format(value); }
        function formatBoolean(value) { return value === null ? 'Nieznane' : value ? 'Tak' : 'Nie'; }
        function formatBuildingType(value) {
            return value === 'wielka plyta' ? 'Wielka płyta'
                : value === 'rama h' ? 'Rama H'
                    : value === 'kamienica' ? 'Kamienica'
                        : value || 'Nieznany';
        }
        function formatTitle(value) {
            const title = String(value).replace(/[✮★☆]/g, ' | ').replace(/\s+/g, ' ').trim();
            return escapeHtml(title);
        }
        function getAddedDate(listing) { return listing.publishedAt || listing.createdAt || listing.refreshedAt || '-'; }
        function getPortalActionLabel(listing) {
            const portal = String(listing.portal || getPortalName(listing.url)).toLowerCase();
            return portal === 'otodom' ? 'Przejdź na OTODOM' : portal === 'olx' ? 'Przejdź na OLX' : 'Przejdź do oferty';
        }
        function getPortalName(value) {
            try {
                const hostname = new URL(value).hostname.toLowerCase();
                if (hostname.includes('otodom')) return 'OTODOM';
                if (hostname.includes('olx')) return 'OLX';
            } catch (_) {}
            return 'INNE';
        }
        function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
        function escapeAttribute(value) { return escapeHtml(value); }
        function getVisitedUrls() { return JSON.parse(localStorage.getItem('flathunter.visited') || '[]'); }
        function isVisited(value) { return getVisitedUrls().includes(value); }
        function markVisited(value) {
            const visited = new Set(getVisitedUrls());
            visited.add(value);
            localStorage.setItem('flathunter.visited', JSON.stringify([...visited]));
        }

        document.querySelector('#refresh').addEventListener('click', () => { currentPage = 1; loadListings(); });
        function setReviewBuildingType(type, title, button) {
            reviewBuildingType = reviewBuildingType === type ? null : type;
            currentPage = 1;
            const wpButton = document.querySelector('#wp-tab');
            const ramaButton = document.querySelector('#rama-tab');
            document.querySelectorAll('.review-tab').forEach(tab => tab.classList.remove('active'));
            showUncertain = false;
            document.querySelector('#uncertain-tab').textContent = 'Niepewne';
            document.querySelector('#page-title').innerHTML = reviewBuildingType
                ? `<a href="/">FlatHunter<br><em>${title}</em></a>`
                : '<a href="/">FlatHunter<br><em>oferty</em></a>';
            wpButton.textContent = reviewBuildingType === 'wielka plyta' ? 'Wróć do ofert' : 'WP do analizy';
            ramaButton.textContent = reviewBuildingType === 'rama h' ? 'Wróć do ofert' : 'Rama H do analizy';
            if (reviewBuildingType) button.classList.add('active');
            loadListings();
        }
        document.querySelector('#wp-tab').addEventListener('click', event => setReviewBuildingType('wielka plyta', 'WP', event.currentTarget));
        document.querySelector('#rama-tab').addEventListener('click', event => setReviewBuildingType('rama h', 'Rama H', event.currentTarget));
        document.querySelector('#uncertain-tab').addEventListener('click', event => {
            showUncertain = !showUncertain;
            reviewBuildingType = null;
            showHidden = false;
            currentPage = 1;
            document.querySelectorAll('.review-tab').forEach(tab => tab.classList.remove('active'));
            event.currentTarget.classList.toggle('active', showUncertain);
            event.currentTarget.textContent = showUncertain ? 'Wróć do ofert' : 'Niepewne';
            document.querySelector('#page-title').innerHTML = showUncertain ? '<a href="/">FlatHunter<br><em>niepewne</em></a>' : '<a href="/">FlatHunter<br><em>oferty</em></a>';
            loadListings();
        });
        document.querySelector('#hidden-tab').addEventListener('click', event => {
            showHidden = !showHidden;
            showUncertain = false;
            reviewBuildingType = null;
            currentPage = 1;
            document.querySelector('#uncertain-tab').classList.remove('active');
            document.querySelector('#uncertain-tab').textContent = 'Niepewne';
            event.currentTarget.classList.toggle('active', showHidden);
            event.currentTarget.textContent = showHidden ? 'Wróć do ofert' : 'Ukryte';
            document.querySelector('#page-title').innerHTML = showHidden ? '<a href="/">FlatHunter<br><em>ukryte</em></a>' : '<a href="/">FlatHunter<br><em>oferty</em></a>';
            loadListings();
        });
        districtElement.addEventListener('change', () => { currentPage = 1; loadListings(); });
        sourceElement.addEventListener('change', () => { currentPage = 1; loadListings(); });
        paginationElement.addEventListener('click', event => {
            const button = event.target.closest('button[data-page]');
            if (!button || button.disabled) return;
            currentPage = Number(button.dataset.page);
            loadListings();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        listingsElement.addEventListener('click', event => {
            const hiddenButton = event.target.closest('button[data-hidden-id]');
            if (hiddenButton) {
                event.preventDefault();
                event.stopPropagation();
                updateHidden(hiddenButton.dataset.hiddenId, !showHidden);
                return;
            }
            if (event.target.closest('select[data-manual-id]')) {
                event.preventDefault();
                event.stopPropagation();
                return;
            }
            const article = event.target.closest('article[data-primary-url]');
            if (article && !event.target.closest('a')) {
                window.open(article.dataset.primaryUrl, '_blank', 'noopener,noreferrer');
                return;
            }
            const link = event.target.closest('a[data-listing-url]');
            if (!link) return;
            markVisited(link.dataset.listingUrl);
            link.closest('.portal').classList.add('visited');
        });

        async function updateHidden(id, hidden) {
            const response = await fetch(`/api/listings/${id}/hidden`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ hidden })
            });
            if (response.ok) await loadListings();
        }
        listingsElement.addEventListener('change', async event => {
            const selector = event.target.closest('select[data-manual-id]');
            if (!selector) return;
            const previousType = selector.dataset.currentType || '';
            const nextType = selector.value || '';
            const nextLabel = nextType === 'wielka plyta' ? 'WP' : nextType === 'rama h' ? 'Rama H' : nextType === 'kamienica' ? 'Kamienica' : 'brak oznaczenia';
            if (!await askConfirmation(`Czy na pewno oznaczyć tę ofertę jako: ${nextLabel}?`)) {
                selector.value = previousType;
                return;
            }
            selector.dataset.currentType = nextType;
            updateManualBuildingType(selector.dataset.manualId, nextType || null);
        });

        function askConfirmation(message) {
            return new Promise(resolve => {
                confirmMessage.textContent = message;
                confirmModal.hidden = false;
                confirmSubmit.focus();
                const finish = result => {
                    confirmModal.hidden = true;
                    confirmCancel.removeEventListener('click', cancel);
                    confirmSubmit.removeEventListener('click', submit);
                    confirmModal.removeEventListener('click', outside);
                    document.removeEventListener('keydown', escape);
                    resolve(result);
                };
                const cancel = () => finish(false);
                const submit = () => finish(true);
                const outside = event => { if (event.target === confirmModal) cancel(); };
                const escape = event => { if (event.key === 'Escape') cancel(); };
                confirmCancel.addEventListener('click', cancel);
                confirmSubmit.addEventListener('click', submit);
                confirmModal.addEventListener('click', outside);
                document.addEventListener('keydown', escape);
            });
        }

        async function updateManualBuildingType(id, buildingType) {
            const response = await fetch(`/api/listings/${id}/building-type`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ buildingType })
            });
            if (!response.ok) {
                statusElement.textContent = 'Nie udało się zapisać oznaczenia.';
                return;
            }
            await loadListings();
        }
        listingsElement.addEventListener('keydown', event => {
            if (event.key !== 'Enter' && event.key !== ' ') return;
            const article = event.target.closest('article[data-primary-url]');
            if (!article || event.target.closest('a')) return;
            event.preventDefault();
            window.open(article.dataset.primaryUrl, '_blank', 'noopener,noreferrer');
        });

        fetch('/api/listings?limit=500').then(response => response.json()).then(data => {
            [...new Set(data.listings.map(listing => listing.district).filter(Boolean))].sort().forEach(value => districtElement.add(new Option(value, value)));
            [...new Set(data.listings.map(listing => listing.portal || getPortalName(listing.url)).filter(Boolean))].sort().forEach(value => sourceElement.add(new Option(value, value)));
            return loadListings();
        }).catch(() => { statusElement.textContent = 'Nie udało się pobrać ofert.'; });
    </script>
</body>
</html>
